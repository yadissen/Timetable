<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            padding: 16px;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            background: white;
        }

        /* HEADER */
        header {
            padding: 14px 20px;
            border-bottom: 3px solid #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 14px;
            background: white;
            border: 1.5px solid #0f172a;
            border-radius: 4px;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #0f172a;
            color: white;
        }

        /* CATEGORY KEY */
        .category-key {
            display: flex;
            gap: 24px;
            padding: 10px 20px;
            border-bottom: 1px solid #e2e8f0;
            background: #fafafa;
            font-size: 10px;
            font-weight: 600;
            color: #475569;
        }

        .key-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .key-color {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            border-left: 3px solid;
        }

        .key-academic { background: #dbeafe; border-left-color: #2563eb; }
        .key-physical { background: #dcfce7; border-left-color: #16a34a; }
        .key-neutral { background: #f1f5f9; border-left-color: #64748b; }
        .key-recovery { background: #ede9fe; border-left-color: #7c3aed; }

        /* SCHEDULE */
        .schedule-wrapper {
            padding: 12px;
            overflow-x: auto;
        }

        .grid-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
            border: 2px solid #0f172a;
        }

        .grid-table th {
            background: #0f172a;
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 12px 8px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-table th:first-child {
            width: 60px;
            min-width: 60px;
            font-size: 10px;
        }

        .grid-table td {
            border: 1px solid #cbd5e1;
            padding: 0;
            vertical-align: top;
        }

        .time-column {
            background: #f8fafc;
            font-size: 10px;
            font-weight: 600;
            color: #475569;
            text-align: center;
            padding: 4px 2px;
            font-variant-numeric: tabular-nums;
            border-right: 2px solid #0f172a !important;
        }

        .day-cell {
            background: white;
            height: 40px;
            min-height: 40px;
            vertical-align: top;
        }

        /* Subtle row striping */
        .grid-table tbody tr:nth-child(even) .day-cell {
            background: #fcfcfd;
        }

        /* ACTIVITY BLOCKS */
        .activity-block {
            padding: 2px 6px;
            font-size: 9px;
            line-height: 1.3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            border-left: 3px solid;
            height: 100%;
        }

        .activity-text {
            flex: 1;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .activity-time {
            font-size: 8px;
            font-weight: 600;
            opacity: 0.5;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* ============================================
           4-CATEGORY COLOR SYSTEM
           ============================================ */

        /* ACADEMIC - Blue (Coursework, Lectures, Projects) */
        .activity-academic {
            background: #dbeafe;
            border-left-color: #2563eb;
            color: #1e40af;
        }

        /* PHYSICAL - Green (Gym, Aim Training) */
        .activity-physical {
            background: #dcfce7;
            border-left-color: #16a34a;
            color: #166534;
        }

        /* NEUTRAL - Gray (Breaks, Meals, Travel) */
        .activity-neutral {
            background: #f1f5f9;
            border-left-color: #64748b;
            color: #475569;
        }

        /* RECOVERY - Lavender (Relax, Sleep) */
        .activity-recovery {
            background: #ede9fe;
            border-left-color: #7c3aed;
            color: #5b21b6;
        }

        /* ============================================
           PRINT STYLES - A3 LANDSCAPE
           ============================================ */
        @media print {
            @page {
                size: A3 landscape;
                margin: 5mm;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background: white !important;
            }

            .container {
                max-width: 100% !important;
                width: 100% !important;
            }

            header {
                padding: 8px 12px !important;
                border-bottom-width: 2px !important;
            }

            .page-title {
                font-size: 16px !important;
            }

            .toolbar {
                display: none !important;
            }

            .category-key {
                padding: 6px 12px !important;
                gap: 16px !important;
                font-size: 8px !important;
            }

            .key-color {
                width: 10px !important;
                height: 10px !important;
                border-left-width: 2px !important;
            }

            .schedule-wrapper {
                padding: 8px !important;
                overflow: visible !important;
            }

            .grid-table {
                min-width: 0 !important;
                width: 100% !important;
                table-layout: fixed !important;
            }

            .grid-table th {
                padding: 8px 4px !important;
                font-size: 9px !important;
            }

            .grid-table th:first-child {
                width: 45px !important;
                min-width: 45px !important;
                font-size: 8px !important;
            }

            .time-column {
                font-size: 8px !important;
                padding: 2px !important;
            }

            .day-cell {
                height: 32px !important;
                min-height: 32px !important;
            }

            .activity-block {
                padding: 1px 4px !important;
                font-size: 7.5px !important;
                border-left-width: 2px !important;
            }

            .activity-text {
                font-size: 7.5px !important;
            }

            .activity-time {
                font-size: 6px !important;
            }

            .container, .schedule-wrapper, .grid-table {
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="page-title">Weekly Schedule</h1>
            <div class="toolbar">
                <button class="btn" onclick="saveSchedule()">Save</button>
                <button class="btn" onclick="loadSchedule()">Load</button>
                <button class="btn" onclick="window.print()">Print</button>
            </div>
        </header>

        <div class="category-key">
            <div class="key-item"><div class="key-color key-academic"></div>Academic</div>
            <div class="key-item"><div class="key-color key-physical"></div>Physical</div>
            <div class="key-item"><div class="key-color key-neutral"></div>Transition</div>
            <div class="key-item"><div class="key-color key-recovery"></div>Recovery</div>
        </div>

        <div class="schedule-wrapper">
            <table class="grid-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                        <th>Sunday</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>

                { time: '13:00 - 14:00', activity: 'Energy Storage' },
                { time: '14:00 - 14:30', activity: 'Come back home + Change' },
                { time: '14:30 - 15:30', activity: 'Energy Storage' },
                { time: '15:30 - 16:00', activity: 'Break + Get ready for Gym' },
                { time: '16:00 - 17:40', activity: 'Gym + Come back home + Shower' },
                { time: '17:40 - 18:00', activity: 'Break' },
                { time: '18:00 - 20:00', activity: 'Dinner + Calls' },
                { time: '20:00 - 21:00', activity: 'Coursework' },
                { time: '21:00 - 22:30', activity: 'Relax + Sleep' }
            ],
            Wednesday: [
                { time: '4:30 - 5:30', activity: 'Wake-up + Have Breakfast + Use Bathroom' },
                { time: '5:30 - 6:15', activity: 'Aim Training - Target Switching' },
                { time: '6:15 - 6:35', activity: 'Break' },
                { time: '6:35 - 9:00', activity: 'Coursework' },
                { time: '9:00 - 9:30', activity: 'Break + Get Ready for Uni' },
                { time: '10:00 - 11:00', activity: 'Water Treatment and Resource Recovery' },
                { time: '11:00 - 11:30', activity: 'Come back home + Change' },
                { time: '11:30 - 12:30', activity: 'Water Treatment and Resource Recovery' },

                { time: '14:00 - 14:30', activity: 'Break + Get ready for Gym' },

            ],

                { time: '6:15 - 6:35', activity: 'Break' },

            Saturday: [
                { time: '4:30 - 5:30', activity: 'Wake-up + Have Breakfast + Use Bathroom' },
                { time: '5:30 - 6:15', activity: 'Aim Training - Dynamic Clicking' },

                { time: '13:00 - 18:00', activity: 'Cook' },

                { time: '20:00 - 21:00', activity: 'Coursework' },

            ],
            Sunday: [
                { time: '4:30 - 5:30', activity: 'Wake-up + Have Breakfast + Use Bathroom' },
                { time: '5:30 - 6:15', activity: 'Aim Training - Tracking' },
                { time: '6:15 - 6:35', activity: 'Break' },
                { time: '6:35 - 7:05', activity: 'Aim Training - Static' },
                { time: '7:05 - 9:05', activity: 'CS2' },
                { time: '10:00 - 12:00', activity: 'Relax' },
                { time: '12:00 - 12:30', activity: 'Lunch' },
                { time: '12:30 - 18:00', activity: 'Relax' },
                { time: '18:00 - 20:00', activity: 'Dinner + Calls' },
                { time: '20:00 - 21:00', activity: 'Relax' },
                { time: '21:00 - 22:30', activity: 'Relax + Sleep' }
            ]
        };

        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function getActivityClass(activity) {
            const act = activity.toLowerCase();

            // PHYSICAL - Gym, Aim Training, CS2
            if (act.includes('aim training') ||
                act.includes('gym') ||
                act.includes('cs2')) {
                return 'activity-physical';
            }

            // ACADEMIC - Coursework, Lectures, Projects
            if (act.includes('coursework') ||
                act.includes('air pollution') ||
                act.includes('energy storage') ||
                act.includes('contaminated land') ||
                act.includes('water treatment') ||
                act.includes('meng project')) {
                return 'activity-academic';
            }

            // RECOVERY - Relax, Sleep
            if (act.includes('relax') ||
                act.includes('sleep')) {
                return 'activity-recovery';
            }

            // NEUTRAL - Everything else (breaks, meals, travel, etc.)
            return 'activity-neutral';
        }

        function renderGrid() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            const startHour = 4;
            const startMinute = 30;
            const endHour = 23;

            for (let hour = startHour; hour <= endHour; hour++) {
                const row = document.createElement('tr');

                const timeCell = document.createElement('td');
                timeCell.className = 'time-column';
                if (hour === startHour) {
                    timeCell.textContent = `${hour}:${startMinute.toString().padStart(2, '0')}`;
                } else {
                    timeCell.textContent = `${hour.toString().padStart(2, '0')}:00`;
                }
                row.appendChild(timeCell);

                days.forEach(day => {
                    const cell = document.createElement('td');
                    cell.className = 'day-cell';

                    let blockStart, blockEnd;
                    if (hour === startHour) {
                        blockStart = startHour * 60 + startMinute;
                        blockEnd = (startHour + 1) * 60;
                    } else {
                        blockStart = hour * 60;
                        blockEnd = (hour + 1) * 60;
                    }

                    const daySchedule = scheduleData[day];
                    daySchedule.forEach((slot) => {
                        const [startTime, endTime] = slot.time.split(' - ');
                        const activityStart = timeToMinutes(startTime);
                        const activityEnd = timeToMinutes(endTime);

                        if (activityEnd > blockStart && activityStart < blockEnd) {
                            const overlapStart = Math.max(activityStart, blockStart);
                            const overlapEnd = Math.min(activityEnd, blockEnd);
                            const overlapDuration = overlapEnd - overlapStart;
                            const blockDuration = blockEnd - blockStart;
                            const heightPercent = (overlapDuration / blockDuration) * 100;

                            const activityDiv = document.createElement('div');
                            activityDiv.className = 'activity-block ' + getActivityClass(slot.activity);
                            activityDiv.style.height = heightPercent + '%';

                            if (activityStart >= blockStart && activityStart < blockEnd) {
                                const textSpan = document.createElement('span');
                                textSpan.className = 'activity-text';
                                textSpan.textContent = slot.activity;
                                activityDiv.appendChild(textSpan);

                                const timeSpan = document.createElement('span');
                                timeSpan.className = 'activity-time';
                                timeSpan.textContent = slot.time;
                                activityDiv.appendChild(timeSpan);
                            }

                            activityDiv.title = slot.time + ': ' + slot.activity;
                            cell.appendChild(activityDiv);
                        }
                    });

                    row.appendChild(cell);
                });

                tbody.appendChild(row);
            }
        }

        function saveSchedule() {
            localStorage.setItem('gridScheduleData', JSON.stringify(scheduleData));
            alert('Saved');
        }

        function loadSchedule() {
            const saved = localStorage.getItem('gridScheduleData');
            if (saved && confirm('Load saved schedule?')) {
                scheduleData = JSON.parse(saved);
                renderGrid();
            }
        }

        window.addEventListener('DOMContentLoaded', renderGrid);
    </script>
</body>
</html>
