<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: white;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 8px;
        }

        /* HEADER - Bold and Impactful */
        header {
            padding: 12px 20px;
            border-bottom: 4px solid #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-content {
            display: flex;
            align-items: baseline;
            gap: 20px;
        }

        .page-title {
            font-size: 42px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .toolbar {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #0f172a;
            border-radius: 4px;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #0f172a;
            color: white;
        }

        /* SCHEDULE - Full Space Usage */
        .schedule-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px 0;
            min-height: 0;
        }

        .grid-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            border: 3px solid #0f172a;
            table-layout: fixed;
        }

        .grid-table th {
            background: #0f172a;
            color: white;
            font-size: 18px;
            font-weight: 800;
            padding: 14px 8px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grid-table th:first-child {
            width: 70px;
            min-width: 70px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .grid-table td {
            border: 1px solid #cbd5e1;
            padding: 0;
            vertical-align: top;
        }

        .time-column {
            background: #f1f5f9;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
            text-align: center;
            padding: 6px 4px;
            font-variant-numeric: tabular-nums;
            border-right: 3px solid #0f172a !important;
        }

        .day-cell {
            background: white;
            height: 52px;
            min-height: 52px;
            vertical-align: top;
        }

        /* Subtle row striping */
        .grid-table tbody tr:nth-child(even) .day-cell {
            background: #fafbfc;
        }

        /* ACTIVITY BLOCKS - Large & Readable */
        .activity-block {
            padding: 4px 8px;
            font-size: 14px;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 4px solid;
            height: 100%;
        }

        .activity-text {
            font-weight: 600;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* ============================================
           4-CATEGORY COLOR SYSTEM
           ============================================ */

        /* ACADEMIC - Blue (Coursework, Lectures, Projects) */
        .activity-academic {
            background: #dbeafe;
            border-left-color: #2563eb;
            color: #1e40af;
        }

        /* PHYSICAL - Green (Gym, Aim Training) */
        .activity-physical {
            background: #dcfce7;
            border-left-color: #16a34a;
            color: #166534;
        }

        /* NEUTRAL - Gray (Breaks, Meals, Travel) */
        .activity-neutral {
            background: #f1f5f9;
            border-left-color: #64748b;
            color: #475569;
        }

        /* RECOVERY - Lavender (Relax, Sleep) */
        .activity-recovery {
            background: #ede9fe;
            border-left-color: #7c3aed;
            color: #5b21b6;
        }

        /* ============================================
           PRINT STYLES - A3 LANDSCAPE POSTER
           ============================================ */
        @media print {
            @page {
                size: A3 landscape;
                margin: 6mm;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background: white !important;
            }

            .container {
                height: 100%;
                padding: 0;
            }

            header {
                padding: 10px 16px;
                border-bottom-width: 3px;
            }

            .page-title {
                font-size: 36px;
                letter-spacing: -1.5px;
            }

            .subtitle {
                font-size: 12px;
            }

            .toolbar {
                display: none !important;
            }

            .schedule-wrapper {
                flex: 1;
                padding: 6px 0;
            }

            .grid-table {
                width: 100%;
                height: 100%;
                border-width: 2px;
            }

            .grid-table th {
                padding: 12px 6px;
                font-size: 16px;
                letter-spacing: 1.5px;
            }

            .grid-table th:first-child {
                width: 60px;
                min-width: 60px;
                font-size: 12px;
            }

            .time-column {
                font-size: 12px;
                padding: 4px 2px;
                border-right-width: 2px !important;
            }

            .day-cell {
                height: auto;
                min-height: 44px;
            }

            .activity-block {
                padding: 3px 6px;
                font-size: 12px;
                border-left-width: 3px;
            }

            .activity-text {
                font-size: 12px;
                -webkit-line-clamp: 2;
            }

            .container, .schedule-wrapper, .grid-table {
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1 class="page-title">Weekly Schedule</h1>
                <span class="subtitle">Execute with Discipline</span>
            </div>
            <div class="toolbar">
                <button class="btn" onclick="saveSchedule()">Save</button>
                <button class="btn" onclick="loadSchedule()">Load</button>
                <button class="btn" onclick="window.print()">Print</button>
            </div>
        </header>

        <div class="schedule-wrapper">
            <table class="grid-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                        <th>Sunday</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>

                { time: '11:40 - 12:30', activity: 'Lunch + Break + Get Ready for Uni' },
                { time: '13:00 - 14:00', activity: 'Energy Storage' },
                { time: '14:00 - 14:30', activity: 'Come back home + Change' },
                { time: '14:30 - 15:30', activity: 'Energy Storage' },
                { time: '15:30 - 16:00', activity: 'Break + Get ready for Gym' },
                { time: '16:00 - 17:40', activity: 'Gym + Come back home + Shower' },
                { time: '17:40 - 18:00', activity: 'Break' },
                { time: '18:00 - 20:00', activity: 'Dinner + Calls' },
                { time: '20:00 - 21:00', activity: 'Coursework' },

                { time: '5:30 - 6:15', activity: 'Aim Training - Target Switching' },
                { time: '6:15 - 6:35', activity: 'Break' },

                { time: '10:00 - 11:00', activity: 'Water Treatment and Resource Recovery' },

            ],

            Saturday: [

                { time: '5:30 - 6:15', activity: 'Aim Training - Dynamic Clicking' },

            ],
            Sunday: [
                { time: '4:30 - 5:30', activity: 'Wake-up + Have Breakfast + Use Bathroom' },
                { time: '5:30 - 6:15', activity: 'Aim Training - Tracking' },
                { time: '6:15 - 6:35', activity: 'Break' },
                { time: '6:35 - 7:05', activity: 'Aim Training - Static' },
                { time: '7:05 - 9:05', activity: 'CS2' },
                { time: '10:00 - 12:00', activity: 'Relax' },
                { time: '12:00 - 12:30', activity: 'Lunch' },
                { time: '12:30 - 18:00', activity: 'Relax' },
                { time: '18:00 - 20:00', activity: 'Dinner + Calls' },
                { time: '20:00 - 21:00', activity: 'Relax' },
                { time: '21:00 - 22:30', activity: 'Relax + Sleep' }
            ]
        };

        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function getActivityClass(activity) {
            const act = activity.toLowerCase();

            // PHYSICAL - Gym, Aim Training, CS2
            if (act.includes('aim training') ||
                act.includes('gym') ||
                act.includes('cs2')) {
                return 'activity-physical';
            }

            // ACADEMIC - Coursework, Lectures, Projects
            if (act.includes('coursework') ||
                act.includes('air pollution') ||
                act.includes('energy storage') ||
                act.includes('contaminated land') ||
                act.includes('water treatment') ||
                act.includes('meng project')) {
                return 'activity-academic';
            }

            // RECOVERY - Relax, Sleep
            if (act.includes('relax') ||
                act.includes('sleep')) {
                return 'activity-recovery';
            }

            // NEUTRAL - Everything else (breaks, meals, travel, etc.)
            return 'activity-neutral';
        }

        function renderGrid() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            const startHour = 4;
            const startMinute = 30;
            const endHour = 23;

            for (let hour = startHour; hour <= endHour; hour++) {
                const row = document.createElement('tr');

                const timeCell = document.createElement('td');
                timeCell.className = 'time-column';
                if (hour === startHour) {
                    timeCell.textContent = `${hour}:${startMinute.toString().padStart(2, '0')}`;
                } else {
                    timeCell.textContent = `${hour.toString().padStart(2, '0')}:00`;
                }
                row.appendChild(timeCell);

                days.forEach(day => {
                    const cell = document.createElement('td');
                    cell.className = 'day-cell';

                    let blockStart, blockEnd;
                    if (hour === startHour) {
                        blockStart = startHour * 60 + startMinute;
                        blockEnd = (startHour + 1) * 60;
                    } else {
                        blockStart = hour * 60;
                        blockEnd = (hour + 1) * 60;
                    }

                    const daySchedule = scheduleData[day];
                    daySchedule.forEach((slot) => {
                        const [startTime, endTime] = slot.time.split(' - ');
                        const activityStart = timeToMinutes(startTime);
                        const activityEnd = timeToMinutes(endTime);

                        if (activityEnd > blockStart && activityStart < blockEnd) {
                            const overlapStart = Math.max(activityStart, blockStart);
                            const overlapEnd = Math.min(activityEnd, blockEnd);
                            const overlapDuration = overlapEnd - overlapStart;
                            const blockDuration = blockEnd - blockStart;
                            const heightPercent = (overlapDuration / blockDuration) * 100;

                            const activityDiv = document.createElement('div');
                            activityDiv.className = 'activity-block ' + getActivityClass(slot.activity);
                            activityDiv.style.height = heightPercent + '%';

                            if (activityStart >= blockStart && activityStart < blockEnd) {
                                const textSpan = document.createElement('span');
                                textSpan.className = 'activity-text';
                                textSpan.textContent = slot.activity;
                                activityDiv.appendChild(textSpan);
                            }

                            activityDiv.title = slot.time + ': ' + slot.activity;
                            cell.appendChild(activityDiv);
                        }
                    });

                    row.appendChild(cell);
                });

                tbody.appendChild(row);
            }
        }

        function saveSchedule() {
            localStorage.setItem('gridScheduleData', JSON.stringify(scheduleData));
            alert('Saved');
        }

        function loadSchedule() {
            const saved = localStorage.getItem('gridScheduleData');
            if (saved && confirm('Load saved schedule?')) {
                scheduleData = JSON.parse(saved);
                renderGrid();
            }
        }

        window.addEventListener('DOMContentLoaded', renderGrid);
    </script>
</body>
</html>
